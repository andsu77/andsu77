<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 196" width="840" height="196" role="img" aria-label="SIMEQ" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t{font:700 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC} .d{font:400 14px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.h{font:400 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC;fill-opacity:.85} .ch{font:500 12px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#60A5FA}
.p{font:500 12px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#22C55E} .lk{font:500 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#60A5FA}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.acc{transform-box:fill-box;transform-origin:center top;animation:grow 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:0.4s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sw{animation:sw 7s ease-in-out infinite;animation-delay:1.9s}
@keyframes sw{0%{transform:translateX(0)}40%,100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="c"><rect width="840" height="196" rx="12"/></clipPath>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F8FAFC" stop-opacity="0"/><stop offset=".5" stop-color="#F8FAFC" stop-opacity=".07"/><stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="839" height="195" rx="12" fill="#0D1117" stroke="#1E293B"/>
<g clip-path="url(#c)"><rect class="sw" x="-220" y="0" width="200" height="196" fill="url(#g)" transform="skewX(-15)"/></g>
<rect class="acc" x="0.5" y="24" width="4" height="148" rx="2" fill="#22C55E"/>
<text x="32" y="48" class="t rise" style="animation-delay:0.4s">SIMEQ</text>
<rect x="653" y="30" width="155" height="24" rx="12" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-opacity=".5"/>
<circle cx="667" cy="42" r="3" fill="#22C55E"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="742.5" y="46" text-anchor="middle" class="p">Projeto acadêmico</text>
<text x="32" y="82" class="d rise" style="animation-delay:0.6s">Sistema acadêmico de manutenção preventiva industrial, voltado ao acompanhamento da</text><text x="32" y="104" class="d rise" style="animation-delay:0.7s">manutenção preventiva de equipamentos industriais.</text>
<text x="32" y="132" class="h rise" style="animation-delay:0.8s">Integração entre software e hardware, com sensores Arduino, incluindo sensor de pressão.</text>
<g class="rise" style="animation-delay:0.9s"><rect x="32" y="150" width="95" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="79.5" y="167" text-anchor="middle" class="ch">TypeScript</text></g><g class="rise" style="animation-delay:1.0s"><rect x="137" y="150" width="74" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="174.0" y="167" text-anchor="middle" class="ch">Arduino</text></g><g class="rise" style="animation-delay:1.1s"><rect x="221" y="150" width="81" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="261.5" y="167" text-anchor="middle" class="ch">Sensores</text></g><g class="rise" style="animation-delay:1.2s"><rect x="312" y="150" width="53" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="338.5" y="167" text-anchor="middle" class="ch">HTML</text></g><g class="rise" style="animation-delay:1.3s"><rect x="375" y="150" width="46" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="398.0" y="167" text-anchor="middle" class="ch">CSS</text></g><g class="rise" style="animation-delay:1.4s"><rect x="431" y="150" width="95" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="478.5" y="167" text-anchor="middle" class="ch">JavaScript</text></g>
<text x="808" y="167" text-anchor="end" class="d">Link do repositório: a preencher</text>
</svg>
