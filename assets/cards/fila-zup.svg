<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 196" width="840" height="196" role="img" aria-label="FILA ZUP" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t{font:700 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC} .d{font:400 14px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.h{font:400 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC;fill-opacity:.85} .ch{font:500 12px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#60A5FA}
.p{font:500 12px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#2563EB} .lk{font:500 13px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#60A5FA}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.acc{transform-box:fill-box;transform-origin:center top;animation:grow 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:0s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sw{animation:sw 7s ease-in-out infinite;animation-delay:1.5s}
@keyframes sw{0%{transform:translateX(0)}40%,100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="c"><rect width="840" height="196" rx="12"/></clipPath>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F8FAFC" stop-opacity="0"/><stop offset=".5" stop-color="#F8FAFC" stop-opacity=".07"/><stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="839" height="195" rx="12" fill="#0D1117" stroke="#1E293B"/>
<g clip-path="url(#c)"><rect class="sw" x="-220" y="0" width="200" height="196" fill="url(#g)" transform="skewX(-15)"/></g>
<rect class="acc" x="0.5" y="24" width="4" height="148" rx="2" fill="#2563EB"/>
<text x="32" y="48" class="t rise" style="animation-delay:0s">FILA ZUP</text>
<rect x="680" y="30" width="128" height="24" rx="12" fill="#2563EB" fill-opacity=".12" stroke="#2563EB" stroke-opacity=".5"/>
<circle cx="694" cy="42" r="3" fill="#2563EB"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="756.0" y="46" text-anchor="middle" class="p">Aplicação web</text>
<text x="32" y="82" class="d rise" style="animation-delay:0.2s">Sistema web de gerenciamento de filas e eventos, desenvolvido para organizar participantes,</text><text x="32" y="104" class="d rise" style="animation-delay:0.3s">controlar operações e facilitar a administração.</text>
<text x="32" y="132" class="h rise" style="animation-delay:0.4s">Backend e frontend, integração de APIs, gerenciamento de dados e recursos administrativos.</text>
<g class="rise" style="animation-delay:0.5s"><rect x="32" y="150" width="95" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="79.5" y="167" text-anchor="middle" class="ch">TypeScript</text></g><g class="rise" style="animation-delay:0.6s"><rect x="137" y="150" width="74" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="174.0" y="167" text-anchor="middle" class="ch">Node.js</text></g><g class="rise" style="animation-delay:0.7s"><rect x="221" y="150" width="129" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="285.5" y="167" text-anchor="middle" class="ch">React / Next.js</text></g><g class="rise" style="animation-delay:0.8s"><rect x="360" y="150" width="46" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="383.0" y="167" text-anchor="middle" class="ch">SQL</text></g><g class="rise" style="animation-delay:0.9s"><rect x="416" y="150" width="53" height="26" rx="13" fill="#2563EB" fill-opacity=".14" stroke="#2563EB" stroke-opacity=".5"/><text x="442.5" y="167" text-anchor="middle" class="ch">APIs</text></g>
<text x="808" y="167" text-anchor="end" class="lk">fila.zuper.cloud</text>
