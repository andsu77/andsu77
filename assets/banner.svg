<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">José Anderson Conceição Neves</title>
<desc id="d">Desenvolvedor de Software em Formação | Python | Backend | SQL | Automação</desc>
<style>
.n{font:700 44px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC}
.r{font:600 20px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#60A5FA}
.s{font:400 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.c{font:400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#94A3B8}
.k{fill:#60A5FA} .v{fill:#22C55E} .w{fill:#F8FAFC}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.float{animation:float 6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.ty{animation:ty 11s ease-in-out infinite both}
@keyframes ty{0%{clip-path:inset(0 100% 0 0)}10%,92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0);opacity:0}}
.cur{animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse">
<path d="M30 0H0V30" fill="none" stroke="#94A3B8" stroke-opacity=".08"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="30 30" dur="5s" repeatCount="indefinite"/>
</pattern>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
<linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#2563EB" stop-opacity="0"/><stop offset=".5" stop-color="#60A5FA" stop-opacity=".9"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient>
<clipPath id="rc"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<rect width="1200" height="300" rx="14" fill="#0D1117"/>
<rect width="1200" height="300" rx="14" fill="url(#g)"/>
<rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#1E293B"/>
<g clip-path="url(#rc)"><rect x="-400" y="297" width="400" height="3" fill="url(#glow)">
<animate attributeName="x" from="-400" to="1200" dur="4.5s" repeatCount="indefinite"/></rect></g>
<rect class="bar" x="56" y="58" width="56" height="4" rx="2" fill="url(#bar)"/>
<text x="56" y="116" class="n rise" style="animation-delay:.15s">José Anderson Conceição Neves</text>
<text x="56" y="158" class="r rise" style="animation-delay:.4s">Desenvolvedor de Software em Formação</text>
<text x="56" y="190" class="s rise" style="animation-delay:.65s">Python  |  Backend  |  SQL  |  Automação</text>
<circle cx="62" cy="241" r="5" fill="#22C55E" fill-opacity=".5"><animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".5;0" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="62" cy="241" r="5" fill="#22C55E"/>
<text x="78" y="246" class="s rise" style="animation-delay:.9s">Camaçari, Bahia, Brasil  –  foco atual em Python</text>
<g transform="translate(790,62)"><g class="float">
<rect width="354" height="176" rx="10" fill="#0D1117" stroke="#1E293B"/>
<circle cx="20" cy="20" r="5" fill="#94A3B8" fill-opacity=".5"/><circle cx="38" cy="20" r="5" fill="#94A3B8" fill-opacity=".5"/><circle cx="56" cy="20" r="5" fill="#94A3B8" fill-opacity=".5"/>
<path d="M0 40H354" stroke="#1E293B"/>
<text x="22" y="68" class="c ty" style="animation-delay:.6s"><tspan class="k">foco</tspan> = <tspan class="v">"Python"</tspan></text>
<text x="22" y="92" class="c ty" style="animation-delay:1.4s"><tspan class="k">areas</tspan> = [<tspan class="v">"backend"</tspan>,</text>
<text x="22" y="116" class="c ty" style="animation-delay:2.2s">          <tspan class="v">"automação"</tspan>]</text>
<text x="22" y="140" class="c ty" style="animation-delay:3s"><tspan class="k">estudando</tspan> = <tspan class="v">"ADS + SENAI"</tspan></text>
<text x="22" y="164" class="c"><tspan class="k">&gt;&gt;&gt;</tspan> <tspan class="w cur">▌</tspan></text>
</g></g>
</svg>
